name: Release TobyFlow Studio Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure ffprobe binary is present in bin/
        shell: pwsh
        run: |
          if (-not (Test-Path "bin")) {
            New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          }
          if (-not (Test-Path "bin/ffprobe.exe")) {
            $ffprobeCmd = Get-Command "ffprobe.exe" -ErrorAction SilentlyContinue
            if ($ffprobeCmd -and (Test-Path $ffprobeCmd.Source)) {
              Write-Host "Sao chep ffprobe tu PATH he thong: $($ffprobeCmd.Source)"
              Copy-Item $ffprobeCmd.Source -Destination "bin/ffprobe.exe"
            } else {
              Write-Host "Tai ffprobe san pham tu nguon Gyan.dev..."
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg-temp.zip"
              Expand-Archive "ffmpeg-temp.zip" -DestinationPath "ffmpeg-temp-extract"
              $probeFound = Get-ChildItem -Path "ffmpeg-temp-extract" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
              if ($probeFound) {
                Copy-Item $probeFound.FullName -Destination "bin/ffprobe.exe"
              }
              Remove-Item "ffmpeg-temp.zip", "ffmpeg-temp-extract" -Recurse -Force
            }
          }
          if (-not (Test-Path "bin/ffprobe.exe")) {
            Write-Error "Khong tim thay hoac tai duoc ffprobe.exe!"
            exit 1
          }
          Write-Host "ffprobe.exe da san sang trong bin/ voi dung luong: $((Get-Item "bin/ffprobe.exe").Length) bytes"

      - name: Run Test Suite
        run: npm test

      - name: Verify Git Tag Matches package.json Version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkgVer = $pkg.version
          $tag = $env:GITHUB_REF_NAME
          $expectedTag = "v$pkgVer"
          Write-Host "Kiem tra: Git Tag '$tag' vs package.json version '$pkgVer'"
          if ($tag -ne $expectedTag) {
            Write-Error "Loi nghiem trong: Git tag '$tag' khong khop voi phien ban trong package.json '$pkgVer' (Ky vong: '$expectedTag')!"
            exit 1
          }
          Write-Host "Xac thuc tag thanh cong: $tag hoan toan khop voi package.json"

      - name: Build Electron Windows Installer (No auto-publish)
        run: npm run build -- --publish never

      - name: Verify Installer Artifacts (Setup.exe, latest.yml, blockmap)
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkgVer = $pkg.version
          $expectedSetup = "TobyFlow-Studio-Setup-$pkgVer.exe"
          $expectedBlockmap = "TobyFlow-Studio-Setup-$pkgVer.exe.blockmap"
          $expectedLatest = "latest.yml"

          $setupPath = Join-Path "dist" $expectedSetup
          $blockmapPath = Join-Path "dist" $expectedBlockmap
          $latestPath = Join-Path "dist" $expectedLatest

          if (-not (Test-Path $setupPath)) {
            Write-Error "Khong tim thay file $expectedSetup trong thu muc dist!"
            exit 1
          }
          if (-not (Test-Path $blockmapPath)) {
            Write-Error "Khong tim thay file $expectedBlockmap trong thu muc dist!"
            exit 1
          }
          if (-not (Test-Path $latestPath)) {
            Write-Error "Khong tim thay file $expectedLatest trong thu muc dist!"
            exit 1
          }

          Write-Host "Xac nhan day du 3 artifacts truoc khi phat hanh:"
          Write-Host " - Installer: $expectedSetup ($([math]::Round((Get-Item $setupPath).Length / 1MB, 2)) MB)"
          Write-Host " - Blockmap: $expectedBlockmap"
          Write-Host " - Latest YML: $expectedLatest"

      - name: Publish Release to GitHub (Single Release Step)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TobyFlow-Studio-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
