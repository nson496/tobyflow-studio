name: Release TobyFlow Studio Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Installer & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Ensure ffprobe binary is present in bin/
        shell: pwsh
        run: |
          if (-not (Test-Path "bin")) {
            New-Item -ItemType Directory -Force -Path "bin" | Out-Null
          }
          if (-not (Test-Path "bin/ffprobe.exe")) {
            $ffprobeCmd = Get-Command "ffprobe.exe" -ErrorAction SilentlyContinue
            if ($ffprobeCmd -and (Test-Path $ffprobeCmd.Source)) {
              Write-Host "Sao chep ffprobe tu PATH he thong: $($ffprobeCmd.Source)"
              Copy-Item $ffprobeCmd.Source -Destination "bin/ffprobe.exe"
            } else {
              Write-Host "Tai ffprobe san pham tu nguon Gyan.dev..."
              Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg-temp.zip"
              Expand-Archive "ffmpeg-temp.zip" -DestinationPath "ffmpeg-temp-extract"
              $probeFound = Get-ChildItem -Path "ffmpeg-temp-extract" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
              if ($probeFound) {
                Copy-Item $probeFound.FullName -Destination "bin/ffprobe.exe"
              }
              Remove-Item "ffmpeg-temp.zip", "ffmpeg-temp-extract" -Recurse -Force
            }
          }
          if (-not (Test-Path "bin/ffprobe.exe")) {
            Write-Error "Khong tim thay hoac tai duoc ffprobe.exe!"
            exit 1
          }
          Write-Host "ffprobe.exe da san sang trong bin/ voi kich thuoc: $((Get-Item "bin/ffprobe.exe").Length) bytes"

      - name: Run Test Suite
        run: npm test

      - name: Build Electron Windows Installer (x64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Verify Installer Artifacts
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "TobyFlow-Studio-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Khong tim thay file TobyFlow-Studio-Setup-*.exe trong thu muc dist!"
            exit 1
          }
          Write-Host "Da tao thanh cong installer: $($installer.FullName) (Dung luong: $([math]::Round($installer.Length / 1MB, 2)) MB)"

          $latestYml = Join-Path "dist" "latest.yml"
          if (-not (Test-Path $latestYml)) {
            Write-Error "Khong tim thay file latest.yml trong thu muc dist!"
            exit 1
          }
          Write-Host "Da tao thanh cong file latest.yml phuc vu cap nhat tu dong."

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/TobyFlow-Studio-Setup-*.exe
            dist/latest.yml
            dist/*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
